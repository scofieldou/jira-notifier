<!doctype html>
<html lang="zh-Hant">
    <head>
        <meta charset="utf-8" />
        <style>
            :root {
                --text: #172b4d;
                --subtle: #6b778c;
                --border: #dfe1e6;
                --hover: #f4f5f7;
            }
            * {
                box-sizing: border-box;
            }
            body {
                width: 380px;
                max-height: 560px;
                margin: 0;
                display: flex;
                flex-direction: column;
                font-family: 'Segoe UI', system-ui, sans-serif;
                font-size: 13px;
                color: var(--text);
                background: #fff;
            }
            header {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 10px 12px;
                border-bottom: 1px solid var(--border);
                flex: none;
            }
            header h1 {
                margin: 0;
                font-size: 13px;
                font-weight: 600;
                flex: 1;
            }
            #sync-state {
                font-size: 11px;
                color: var(--subtle);
            }
            .icon-btn:disabled {
                color: #b3bac5;
                cursor: default;
            }
            .bar {
                flex: none;
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 7px 12px;
                font-size: 12px;
                background: #f3f0ff;
                color: #5e4db2;
                border-bottom: 1px solid #ddd6fe;
            }
            .bar.hidden {
                display: none;
            }
            .bar span {
                flex: 1;
            }
            .bar button {
                border: 1px solid #c7bfff;
                background: #fff;
                color: #5e4db2;
                border-radius: 4px;
                padding: 3px 9px;
                font-size: 11px;
                font-family: inherit;
                cursor: pointer;
            }
            .bar button:hover {
                background: #f3f0ff;
            }
            .missed {
                border-bottom: 3px solid #ddd6fe;
            }
            .missed-head {
                display: flex;
                align-items: center;
                gap: 6px;
                padding: 7px 12px 5px;
                background: #f3f0ff;
                font-size: 11px;
                font-weight: 600;
                color: #5e4db2;
            }
            .missed-head span {
                flex: 1;
            }
            .missed-head button {
                border: 0;
                background: transparent;
                color: #5e4db2;
                font-size: 12px;
                cursor: pointer;
                padding: 0 3px;
            }
            .missed-note {
                padding: 5px 12px 7px;
                font-size: 11px;
                color: var(--subtle);
                background: #faf9ff;
            }
            .issue.synthetic {
                cursor: default;
            }
            .issue.synthetic:hover {
                background: transparent;
            }
            main {
                overflow-y: auto;
                flex: 1;
            }
            .group-head {
                display: flex;
                align-items: baseline;
                gap: 6px;
                padding: 8px 12px 4px;
                background: #fafbfc;
                border-bottom: 1px solid var(--border);
                position: sticky;
                top: 0;
                cursor: pointer;
                user-select: none;
            }
            .group-head:hover {
                background: #f1f2f4;
            }
            .caret {
                display: inline-block;
                font-size: 9px;
                color: var(--subtle);
                transition: transform 0.12s ease;
                width: 9px;
            }
            .group-head.collapsed .caret {
                transform: rotate(-90deg);
            }
            .group-body.collapsed {
                display: none;
            }
            .group-key {
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.04em;
            }
            .group-name {
                font-size: 11px;
                color: var(--subtle);
                flex: 1;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .group-count {
                font-size: 11px;
                color: var(--subtle);
            }
            .issue {
                display: flex;
                gap: 8px;
                padding: 8px 12px;
                border-bottom: 1px solid var(--border);
                cursor: pointer;
                align-items: flex-start;
            }
            .issue:hover {
                background: var(--hover);
            }
            .dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                margin-top: 4px;
                flex: none;
            }
            .issue-body {
                flex: 1;
                min-width: 0;
            }
            .issue-top {
                display: flex;
                gap: 6px;
                align-items: baseline;
            }
            .key {
                font-weight: 600;
                font-size: 12px;
                color: #0c66e4;
            }
            .prio {
                font-size: 11px;
                color: var(--subtle);
            }
            .summary {
                margin-top: 2px;
                line-height: 1.35;
                word-break: break-word;
            }
            .meta {
                margin-top: 4px;
                display: flex;
                gap: 6px;
                align-items: center;
                flex-wrap: wrap;
            }
            .chip {
                font-size: 10px;
                padding: 1px 6px;
                border-radius: 3px;
                background: #dfe1e6;
                color: #42526e;
            }
            .due {
                font-size: 10px;
                color: #ae2e24;
            }
            .empty,
            .problem {
                padding: 28px 20px;
                text-align: center;
                color: var(--subtle);
                line-height: 1.6;
            }
            .problem strong {
                display: block;
                color: var(--text);
                margin-bottom: 6px;
            }
            .problem button {
                margin-top: 10px;
                border: 0;
                border-radius: 4px;
                background: #0c66e4;
                color: #fff;
                padding: 7px 14px;
                font-size: 12px;
                cursor: pointer;
            }
            footer {
                flex: none;
                padding: 8px 12px;
                border-top: 1px solid var(--border);
            }
            .icon-btn {
                border: 1px solid var(--border);
                background: #fff;
                border-radius: 4px;
                padding: 3px 7px;
                font-size: 12px;
                line-height: 1.4;
                cursor: pointer;
                color: var(--subtle);
            }
            .icon-btn:hover {
                background: var(--hover);
                color: var(--text);
            }
            footer a {
                font-size: 11px;
                color: #0c66e4;
                text-decoration: none;
                cursor: pointer;
            }
            footer a:hover {
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>指派給我的單</h1>
            <span id="sync-state"></span>
            <button id="refresh" class="icon-btn" title="重新整理">↻</button>
            <button id="toggle-mute" class="icon-btn" title="靜音">🔔</button>
            <button id="open-options" class="icon-btn" title="設定">⚙</button>
        </header>
        <div id="mute-bar" class="bar hidden">
            <span id="mute-text"></span>
            <button id="unmute">解除靜音</button>
        </div>
        <main id="list"></main>
        <footer><a id="open-all">在 Jira 開啟完整清單 →</a></footer>
        <script src="popup.js"></script>
    </body>
</html>
